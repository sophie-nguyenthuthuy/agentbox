[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbox-runtime"
version = "0.3.0"
description = "Policy-sandboxed runtime for AI agent processes: enforce a policy file, capture a tamper-evident trace, deterministically replay any run."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sophie Nguyen Thu Thuy", email = "sophie.nguyenthuthuy@gmail.com" }]
keywords = ["agents", "sandbox", "policy", "replay", "trace", "llm", "safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/sophie-nguyenthuthuy/agentbox"

[project.scripts]
agentbox = "agentbox.cli:main"

[tool.setuptools.packages.find]
include = ["agentbox*"]

[tool.setuptools.package-data]
agentbox = ["_inject/node/*.cjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
